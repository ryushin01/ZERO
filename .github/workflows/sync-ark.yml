name: Ark 동기화

# Ark(세계 신화 도서관)의 신화 계열·신·영웅·몬스터·유물·탈것과 동반자 짝이 바뀌었는지 매일 확인해 ZERO에 그대로 가져옵니다.
# 1. sync: Ark를 받아 `pnpm sync:ark` → 바뀌었으면 그림·글꼴까지 만들어 sync/ark에 커밋하고 PR을 엽니다.
# 2. verify: CI 전체(ci.yml: 형식·린트·타입·단위·빌드·용량·E2E·Lighthouse)로 sync/ark를 검사합니다.
# 3. merge: 검사를 통과하면 PR을 스쿼시로 합칩니다(Vercel이 배포). 실패하면 PR을 열어 둡니다.
# 바로 돌리려면: gh workflow run sync-ark.yml

on:
  schedule:
    # 매일 한국 시각 새벽 4시 (UTC 19시)
    - cron: "0 19 * * *"
  workflow_dispatch:
  # 다른 곳에서 알릴 때: gh api repos/ryushin01/ZERO/dispatches -f event_type=ark-updated
  repository_dispatch:
    types: [ark-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-ark
  cancel-in-progress: false

jobs:
  sync:
    name: Ark에서 가져오기
    # Ark 자료 그림 줄이기(sips)와 새 그림의 초점 찾기(Vision)가 macOS 도구라 macOS에서 돌립니다.
    runs-on: macos-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: zero
      - uses: actions/checkout@v7
        with:
          repository: ryushin01/Ark
          path: ark

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: zero/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: zero/.nvmrc
          cache: pnpm
          cache-dependency-path: zero/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: zero

      - name: Ark 데이터 가져오기
        working-directory: zero
        env:
          ARK_DIR: ../ark
          SYNC_SUMMARY: ${{ runner.temp }}/summary.md
        run: pnpm sync:ark

      - name: 바뀌었는지 보기
        id: diff
        working-directory: zero
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: 새 그림 받기 (Wikimedia Commons)
        if: steps.diff.outputs.changed == 'true'
        working-directory: zero
        run: |
          brew install webp
          pnpm illustrations

      - name: 화면 글자가 늘었으면 글꼴 다시 만들기
        if: steps.diff.outputs.changed == 'true'
        working-directory: zero
        run: |
          if ! pnpm fonts --check; then
            python3 -m venv "$RUNNER_TEMP/fonts"
            "$RUNNER_TEMP/fonts/bin/pip" install --quiet fonttools brotli
            PATH="$RUNNER_TEMP/fonts/bin:$PATH" pnpm fonts
          fi

      - name: sync/ark에 커밋
        id: commit
        if: steps.diff.outputs.changed == 'true'
        working-directory: zero
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ark="$(git -C ../ark rev-parse --short HEAD)"
          git config user.name "ryushin0"
          git config user.email "141554987+ryushin01@users.noreply.github.com"
          node scripts/changelog-sync.mjs "$RUNNER_TEMP/summary.md" "$ark"
          git switch -C sync/ark
          git add -A
          git commit -m "chore: Ark 동기화 (ryushin01/Ark@${ark})" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git push --force origin sync/ark
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # 바뀐 내용을 PR로 남깁니다. 이미 열린 동기화 PR이 있으면 제목과 본문만 고칩니다.
          {
            echo "Ark [ryushin01/Ark@${ark}](https://github.com/ryushin01/Ark/commit/${ark})의 데이터를 그대로 가져왔습니다."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "CI 전체 검사를 통과하면 자동으로 합쳐집니다. [동기화 실행 기록](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "$RUNNER_TEMP/body.md"
          title="chore: Ark 동기화 (ryushin01/Ark@${ark})"
          if [ "$(gh pr view sync/ark --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit sync/ark --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head sync/ark --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          {
            echo "## Ark 동기화 (ryushin01/Ark@${ark})"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 검사
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: sync/ark

  merge:
    name: PR 합치기
    needs: [sync, verify]
    runs-on: ubuntu-latest
    steps:
      - name: 검사를 통과한 동기화 PR 합치기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.sync.outputs.sha }}
        # 검사한 커밋 그대로일 때만 합칩니다. (그 사이 브랜치가 바뀌었으면 멈춤)
        run: gh pr merge sync/ark --squash --delete-branch --match-head-commit "$SHA"
