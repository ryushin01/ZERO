name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ark 동기화(sync-ark.yml)가 동기화 브랜치를 합치기 전에 같은 검사를 부릅니다.
  workflow_call:
    inputs:
      ref:
        description: 검사할 브랜치
        type: string
        required: true

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Lint · FSD · Typecheck · Test · Build · Storybook · Size · E2E · Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Ark 동기화에서 부를 때는 동기화 브랜치를, 그 밖에는 이벤트의 커밋을 검사합니다.
          ref: ${{ inputs.ref }}

      # pnpm 버전은 package.json의 packageManager를 따릅니다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:fsd
      - run: pnpm check
      - run: pnpm test
      # 앱과 Storybook(dist/storybook)을 함께 빌드합니다.
      - run: pnpm build
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm lhci
      # 휴대폰 기준(느린 4G·CPU 4배)으로 처음 화면의 CLS·LCP를 따로 잽니다. 데스크톱만 재면 글꼴이 늦게 와서 생기는 밀림을 놓칩니다.
      - run: pnpm lhci:mobile
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          # .lighthouseci는 숨김 폴더라 따로 켜야 올라갑니다.
          include-hidden-files: true
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
