version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-*", "steiger", "@feature-sliced/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
